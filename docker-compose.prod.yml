# Production-oriented compose file.
# - Uses built images (CI can publish to GHCR)
# - Runs as non-root inside containers
# - Includes health checks
# - Additional security: read-only FS, no-new-privileges, dropped caps, resource limits

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: disha
      POSTGRES_USER: disha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disha -d disha"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  disha-brain:
    profiles: ["full"]
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-tashima-tarsh}/disha-brain:latest
    environment:
      DISHA_BRAIN_API_HOST: 0.0.0.0
      DISHA_BRAIN_API_PORT: 8080
      DISHA_BRAIN_API_TOKEN: ${DISHA_BRAIN_API_TOKEN:-change-me}
      DISHA_BRAIN_DB_PATH: /data/disha_brain.db
      DISHA_ALLOWED_ORIGINS: ${DISHA_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - disha_data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health').read(); print('ok')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  web-migrate:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-tashima-tarsh}/disha-web:latest
    command: ["node", "scripts/apply-schema.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:?set-me}@postgres:5432/disha
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1001:1001"

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-tashima-tarsh}/disha-web:latest
    environment:
      NODE_ENV: production
      DISHA_AUTH_MODE: ${DISHA_AUTH_MODE:-dev-jwt}
      DISHA_JWT_SECRET: ${DISHA_JWT_SECRET:?set-me}
      DISHA_DEV_PASSWORD: ${DISHA_DEV_PASSWORD:?set-me}
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:?set-me}@postgres:5432/disha
      REDIS_URL: redis://redis:6379
      DISHA_ALLOWED_ORIGINS: ${DISHA_ALLOWED_ORIGINS:-http://localhost:3000}
      DISHA_BRAIN_URL: ${DISHA_BRAIN_URL:-}
      DISHA_BRAIN_API_TOKEN: ${DISHA_BRAIN_API_TOKEN:-}

      # Cloud model (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1001:1001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  disha_data:


name: Feature request
description: Propose a focused improvement to DISHA.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        DISHA prefers small, evidence-preserving changes over broad rewrites. Please explain the public-interest value of the feature.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Evidence ledger
        - Policy gate
        - Agentic workbench
        - Source registry / parser
        - Governed model adapter
        - Documentation
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and policy impact
      description: What sources, policy rules, or evidence events would be affected?
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Contribution boundary
      options:
        - label: This does not add unsupported factual claims.
        - label: This does not ingest private, leaked, credential, token, or controlled material.
        - label: This can be tested or documented clearly.

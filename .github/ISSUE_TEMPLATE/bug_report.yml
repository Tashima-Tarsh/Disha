name: Bug report
description: Report a reproducible product or documentation defect.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve DISHA. Please do not include secrets, credentials, private evidence, controlled data, or personal data.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web API / runtime
        - Agentic workbench
        - Evidence ledger
        - Policy gate
        - Source registry / source admission
        - Documentation
        - CI / deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the defect clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm.cmd --prefix web run dev`
        2. Open `http://127.0.0.1:3000/workbench`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Node:
        - Browser:
        - Commit:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and private data before posting.
    validations:
      required: false

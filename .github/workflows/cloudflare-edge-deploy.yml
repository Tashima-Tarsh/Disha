name: DISHA Cloudflare Edge Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/cloudflare-proxy.ts"
      - "web/wrangler.jsonc"
      - ".github/workflows/cloudflare-edge-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disha-cloudflare-edge
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy custom-domain proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment secrets are not configured in this repository."
            exit 1
          fi

      - name: Deploy DISHA edge proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

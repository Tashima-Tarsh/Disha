name: Refresh OpenNext esbuild lockfile

on:
  push:
    branches:
      - fix/opennext-esbuild-runtime
    paths:
      - .github/workflows/opennext-esbuild-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/opennext-esbuild-runtime
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Match Cloudflare npm version
        run: npm install --global npm@10.9.2

      - name: Install esbuild required by OpenNext CLI
        working-directory: web
        run: npm install --save-dev --save-exact esbuild@0.28.1

      - name: Verify OpenNext CLI resolves esbuild
        working-directory: web
        run: node -e "import('esbuild').then(m => console.log('esbuild', m.version))"

      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata changes to commit."
            exit 0
          fi
          git commit -m "fix: install esbuild for OpenNext Cloudflare CLI"
          git push origin HEAD:fix/opennext-esbuild-runtime

name: DISHA Brain

on:
  pull_request:
  push:
    branches: [main]

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pytest ruff bandit
      - name: Lint production brain spine
        run: ruff check disha/brain tests
      - name: Check production brain formatting
        run: ruff format disha/brain tests --check
      - name: Security scan production brain spine
        run: bandit -q -r disha/brain
      - name: Run graph tests
        run: pytest tests/test_disha_brain_graph.py

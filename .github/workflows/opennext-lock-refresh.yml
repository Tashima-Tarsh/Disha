name: Refresh OpenNext lockfile

on:
  push:
    branches:
      - fix/opennext-dependency-lock
    paths:
      - .github/workflows/opennext-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/opennext-dependency-lock
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install OpenNext dependency and refresh lockfile
        working-directory: web
        run: npm install --save-dev --save-exact @opennextjs/cloudflare@1.20.6

      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata changes to commit."
            exit 0
          fi
          git commit -m "fix: install OpenNext Cloudflare adapter"
          git push origin HEAD:fix/opennext-dependency-lock

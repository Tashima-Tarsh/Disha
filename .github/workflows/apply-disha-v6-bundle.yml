name: Apply DISHA production v6 bundle

on:
  push:
    branches:
      - production-v6
    paths:
      - ".disha-bundle/READY"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production-v6
          fetch-depth: 0

      - name: Verify and apply DISHA v6 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .disha-bundle/part-* > /tmp/disha-v6-overlay.tar.gz.b64
          base64 -d /tmp/disha-v6-overlay.tar.gz.b64 > /tmp/disha-v6-overlay.tar.gz
          echo "835949bcfc3215f9f0b5b9b11e1e7c4ec58cf28b6fc91e67871cd5636bee1cdf  /tmp/disha-v6-overlay.tar.gz" | sha256sum -c -
          tar -tzf /tmp/disha-v6-overlay.tar.gz >/dev/null
          tar -xzf /tmp/disha-v6-overlay.tar.gz -C .

          if [ -f .disha-delete-list ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                /*|../*|*/../*) echo "Unsafe delete path: $path" >&2; exit 1 ;;
              esac
              rm -rf -- "$path"
            done < .disha-delete-list
          fi

          rm -f .disha-delete-list

          # Do not let the workflow's GitHub App token modify workflow files.
          # Those two production workflow updates are applied separately through
          # the authenticated repository connector after this source sync.
          git restore --source=HEAD -- .github/workflows
          rm -rf .disha-bundle .disha-patch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "DISHA production v6: continuous intelligence and GitHub production"
          git push origin HEAD:production-v6

name: Apply DISHA production v6 patch

on:
  push:
    branches: [production-v6]
    paths:
      - ".disha-patch/READY"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production-v6
          fetch-depth: 0
      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .disha-patch/part-* | base64 -d > /tmp/disha-v6.patch
          git apply --check /tmp/disha-v6.patch
          git apply /tmp/disha-v6.patch
          rm -rf .disha-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DISHA production v6: continuous intelligence and GitHub live deployment"
          git push origin HEAD:production-v6

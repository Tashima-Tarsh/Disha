name: DISHA Product CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: disha-product-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web product verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Type-check (full project graph)
        run: npm run type-check:full

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  python-governed-source:
    name: Governed source verification (Vyuha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint/test tooling
        run: python -m pip install --quiet ruff pytest

      - name: Ruff (Vyuha Defense Engine)
        run: python -m ruff check skills/vyuha-defense-engine

      - name: Pytest (Vyuha Defense Engine)
        run: python -m pytest skills/vyuha-defense-engine/tests -q
